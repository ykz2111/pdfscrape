image: python:3.11-slim

stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  paths:
    - .cache/pip

before_script:
  - pip install --upgrade pip
  - pip install -e ".[dev]"

lint:
  stage: lint
  script:
    - ruff check pdfscrape/ tests/

test:
  stage: test
  script:
    - pytest -q tests/
  coverage: '/TOTAL.*\s+(\d+%)$/'

build:
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
