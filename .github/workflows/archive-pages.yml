name: Archive Pages

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Public sources only. Do not pass provider credentials or run AI enrichment here.
permissions:
  contents: read

# Serialize publications: cancelling a deployment can interrupt a Pages release.
concurrency:
  group: archive-pages
  cancel-in-progress: false

jobs:
  build:
    name: Harvest, validate, and build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CLI
        run: python -m pip install .
      - name: Require archive implementation
        shell: bash
        run: |
          set -euo pipefail
          if ! pdfscrape archive --help; then
            echo "::error::Archive Phases 1–3 must be installed before publishing (missing archive CLI)."
            exit 1
          fi
          for command in harvest validate build-site; do
            pdfscrape archive "$command" --help
          done
          test -f config/sources.yaml
      - name: Harvest public sources
        run: pdfscrape archive harvest --output build/catalog.jsonl
      - name: Validate harvested records
        run: pdfscrape archive validate --input build/catalog.jsonl
      - name: Build static catalog
        run: pdfscrape archive build-site --input build/catalog.jsonl --output dist/archive
      - name: Validate exported records
        run: pdfscrape archive validate --input dist/archive/catalog.json
      - name: Require publishable artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/archive/index.html
          test -s dist/archive/catalog.json
          # Fail closed on a broken/empty harvest, preserving the last good publication.
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("dist/archive/catalog.json").read_text(encoding="utf-8"))
          if not isinstance(catalog, list) or not catalog:
              raise SystemExit("Expected a nonempty catalog.json array; refusing publication.")
          PY
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/archive

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
