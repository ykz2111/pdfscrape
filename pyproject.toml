[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfscrape"
version = "0.1.0"
description = "One CLI for every AI provider you are already signed in to (OAuth, no API keys)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
pdfscrape = "pdfscrape.cli:main"

[tool.setuptools]
packages = ["pdfscrape", "pdfscrape.cli", "pdfscrape.chat", "pdfscrape.config", "pdfscrape.providers"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
