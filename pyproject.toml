[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfscrape"
version = "0.1.0"
description = "Unified CLI for multiple AI models and chat platforms"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]
providers = [
    "openai>=1.0",
    "google-generativeai>=0.3",
    "ollama>=0.1",
]

[project.scripts]
pdfscrape = "pdfscrape.cli:main"

[tool.setuptools]
packages = ["pdfscrape"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
