# Example pdfscrape configuration
# Located at ~/.pdfscrape/config.yaml

providers:
  copilot:
    enabled: true
    token: ${GITHUB_COPILOT_TOKEN}

  claude:
    enabled: true
    api_key: ${ANTHROPIC_API_KEY}

  gemini:
    enabled: true
    api_key: ${GOOGLE_AI_API_KEY}

  ollama:
    enabled: true
    base_url: http://localhost:11434

  gitlab_chat:
    enabled: true
    gitlab_url: https://gitlab.com
    token: ${GITLAB_TOKEN}
    project_id: your-project-id

  antigravity:
    enabled: true
    api_key: ${GOOGLE_AI_API_KEY}

chat:
  default_provider: auto
  model: gpt-4
  temperature: 0.7
  max_tokens: 4096

logging:
  level: INFO
  file: ~/.pdfscrape/pdfscrape.log
